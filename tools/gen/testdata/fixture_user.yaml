# 前台用户（见 docs/agents/auth.md 的"前台用户"）。账号只能经登录创建，后台只能查看、停用和启用。
module: fxuser
resource: fx_user
title: 用户
description: 前台用户。账号由登录创建，后台只能查看、停用和启用
display: display_name
fields:
  display_name: { type: string, title: 昵称, required: true, max: 64 }
  avatar_url:   { type: string, title: 头像, max: 1024 }
  status:       { type: enum, title: 状态, values: { active: 正常, disabled: 已停用, deleted: 已注销 }, default: active, readonly: true }
indexes:
  - columns: [-created_at, -id]
    for: 后台用户列表的默认排序：ORDER BY created_at DESC, id DESC LIMIT/OFFSET
  # status 只有三个取值，按它筛选不建索引
admin:
  operations: []
  list:
    columns: [display_name, status, created_at]
    search: [display_name]
    filter: [status, created_at]
  nav: { icon: UserRound, order: 3 }
  actions:
    disable:
      title: 停用
      when: { status: active }
      confirm: 停用会吊销对方的全部会话，可以随时启用。
      custom: >-
        状态改为 disabled，并在同一个事务里吊销该用户的全部会话（user_sessions 的 revoked_at 为空的行
        置为 now()）；状态不是 active 时返回 ErrInvalidState
    enable:
      title: 启用
      set: { status: active }
      when: { status: disabled }
